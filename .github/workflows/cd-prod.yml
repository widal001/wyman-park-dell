name: CD - Production

# Build + deploy to production. This is the single deploy definition; it runs on
# pushes to main, on manual dispatch, and when called by another workflow
# (cms-publish invokes it via `uses:` after merging a content PR).
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and deploy
        type: string
        default: main

# Serialize prod deploys so two runs (e.g. a push and a CMS publish) can't race.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On push/dispatch `inputs.ref` is empty, so fall back to main.
          ref: ${{ inputs.ref || 'main' }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run checks

      - name: Build
        run: pnpm run build

      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output=$(pnpm run deploy 2>&1)
          echo "$output"
          url=$(echo "$output" \
            | grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' \
            | head -n1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
