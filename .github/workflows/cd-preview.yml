name: CD - Preview

# One preview per PR (stable pr-N alias via `wrangler versions upload
# --preview-alias`). Runs two ways:
#   - on: pull_request       — regular (dev) PRs.
#   - on: workflow_call      — invoked by cms-open-pr for content/** branches,
#                              whose bot-opened PRs don't fire pull_request
#                              events (GITHUB_TOKEN limitation).
# The pull_request path skips content/** heads so they aren't previewed twice
# (cms-open-pr already calls this workflow for them).
on:
  pull_request:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to alias and comment on
        type: string
        required: true
      sha:
        description: Commit SHA to build and preview
        type: string
        required: true

concurrency:
  group: deploy-preview-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # On the pull_request path, let cms-open-pr own content/** previews.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'content/')
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      HEAD_SHA: ${{ inputs.sha || github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD_SHA }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run checks

      - name: Build
        run: pnpm run build
        env:
          # Public site key, baked into static HTML at build. Falls back to the
          # always-pass test key if the variable is unset.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Upload Worker version (preview)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output=$(pnpm exec wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} @ ${HEAD_SHA}" \
            2>&1)
          echo "$output"
          url=$(echo "$output" \
            | grep -E 'Version Preview Alias URL:' \
            | sed -E 's/.*URL:[[:space:]]*//' \
            | head -n1)
          if [ -z "$url" ]; then
            echo "::warning::Could not extract preview URL from wrangler output"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ env.PR_NUMBER }}
          header: cloudflare-preview
          message: |
            ### Cloudflare preview — PR #${{ env.PR_NUMBER }}

            **${{ steps.deploy.outputs.url }}**

            Stable for the life of the PR (alias `pr-${{ env.PR_NUMBER }}`).

            _Last updated: commit `${{ env.HEAD_SHA }}`_
