name: Deploy preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# One preview per PR; new commits cancel the in-flight build.
concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm astro check

      # CLOUDFLARE_ENV=preview tells @cloudflare/vite-plugin to resolve the
      # env.preview block from wrangler.jsonc into the generated config, baking
      # in the preview D1 + R2 bindings. env.preview sets name=wyman-park-dell
      # so the version is uploaded to the prod worker (not a separate -preview
      # one); --preview-alias gives each PR its own isolated test URL.
      - name: Build (preview env)
        env:
          CLOUDFLARE_ENV: preview
        run: pnpm build

      - name: Upload Worker version (preview)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Bindings are already baked in by the preview build; no --env flag needed.
          output=$(pnpm exec wrangler versions upload \
            --preview-alias pr-${{ github.event.pull_request.number }} \
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}" \
            2>&1)
          echo "$output"
          url=$(echo "$output" \
            | grep -E 'Version Preview Alias URL:' \
            | sed -E 's/.*URL:[[:space:]]*//' \
            | head -n1)
          if [ -z "$url" ]; then
            echo "::warning::Could not extract preview URL from wrangler output"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.deploy.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-preview
          message: |
            ### Cloudflare Workers preview — PR #${{ github.event.pull_request.number }}

            **${{ steps.deploy.outputs.url }}**

            This URL is stable for the lifetime of the PR (alias `pr-${{ github.event.pull_request.number }}`). Uses the **preview** D1 + R2 bindings (isolated from prod).

            _Last updated: commit `${{ github.event.pull_request.head.sha }}`_
