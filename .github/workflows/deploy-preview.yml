name: Deploy preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# One preview per PR; new commits cancel the in-flight build.
concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm astro check

      - name: Build
        run: pnpm build

      - name: Upload Worker version (preview)
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            versions upload
            --env preview
            --preview-alias pr-${{ github.event.pull_request.number }}
            --message "PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"

      - name: Extract preview URL
        id: url
        run: |
          # --preview-alias gives a stable URL: pr-<N>.<worker-name>.<subdomain>.workers.dev
          # Extract it from the "Worker Version Preview URL:" line in the output.
          url=$(printf '%s\n' "${{ steps.deploy.outputs.command-output }}" \
            | grep -E '^[[:space:]]*(Version Preview URL|Worker Version Preview URL):' \
            | sed -E 's/^[[:space:]]*(Version Preview URL|Worker Version Preview URL):[[:space:]]*//' \
            | head -n1)
          if [ -z "$url" ]; then
            echo "::warning::Could not extract preview URL from wrangler output"
          fi
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.url.outputs.url != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-preview
          message: |
            ### Cloudflare Workers preview — PR #${{ github.event.pull_request.number }}

            **${{ steps.url.outputs.url }}**

            This URL is stable for the lifetime of the PR (alias `pr-${{ github.event.pull_request.number }}`). It hits the same D1 + R2 bindings as production — edits made via the admin in the preview persist to prod.

            _Last updated: commit `${{ github.event.pull_request.head.sha }}`_
