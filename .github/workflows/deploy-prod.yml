name: Deploy production

on:
  push:
    branches: [main]

# Serialize prod deploys so two pushes back-to-back can't race.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm astro check

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Extract production URL
        id: url
        run: |
          # `wrangler deploy` prints "Published https://<name>.<subdomain>.workers.dev (X sec)".
          url=$(printf '%s\n' "${{ steps.deploy.outputs.command-output }}" \
            | grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' \
            | head -n1)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
