name: Sync Worker secrets

# Push the forms' runtime secrets (from GitHub Actions secrets) onto the
# wyman-park-dell Worker. Run manually once, after the first deploy that
# includes the SSR routes, and again whenever you rotate a credential.
#
# Why a separate, manual workflow instead of folding this into cd-prod:
#   - Worker secrets persist across deploys and are inherited by preview
#     versions, so they only need setting on setup + rotation, not per deploy.
#   - This keeps the routine deploy pipelines (which run on every push, incl.
#     CMS content publishes) free of these secrets — a smaller exposure surface.
#
# Values are piped to `wrangler secret put` via stdin — never written to a file.
# Runs under the `production` environment so it inherits its approval/audit rules.

on:
  workflow_dispatch:

concurrency:
  group: sync-secrets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # No secrets in this step's env, so dependency install scripts never see them.
      - run: pnpm install --frozen-lockfile

      - name: Push secrets to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_AUDIENCE_ID: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
          MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
        run: |
          set -euo pipefail
          # Read the value from the corresponding env var and pipe it via stdin;
          # `set -u` makes a missing GitHub secret fail the run instead of
          # silently uploading an empty value.
          put() { printf '%s' "${!1}" | pnpm exec wrangler secret put "$1"; }
          put TURNSTILE_SECRET_KEY
          put SMTP_USER
          put SMTP_PASS
          put MAIL_FROM
          put MAIL_TO
          put MAILCHIMP_API_KEY
          put MAILCHIMP_AUDIENCE_ID
          put MAILCHIMP_SERVER_PREFIX
