# Pages CMS config — experiment/pages-cms
#
# Editing happens on app.pagescms.org (no local admin). Content is stored as pure
# YAML (`.yaml`, `format: yaml`) — no frontmatter fences or body — read by
# Astro's glob loader and validated by the same src/content.config.ts Zod schema.
# `blockKey: type` discriminates the block union.

# Write Conventional Commit messages for edits made through the CMS (default is
# "Action {path} (via Pages CMS)"). {path} is the file the editor changed.
settings:
  commit:
    templates:
      create: 'feat(content): add {path}'
      update: 'chore(content): update {path}'
      delete: 'chore(content): remove {path}'
      rename: 'chore(content): rename {oldPath} to {newPath}'

# Images live in the repo under src/assets/media so Astro's <Image> component
# optimizes them at build time (hashed, immutable /_astro/* output). `input` is
# the repo storage folder; `output` is the path written into content — they
# intentionally differ. Content keeps referencing images as /media/foo.jpg;
# src/lib/images.ts maps that prefix to the src/assets/media asset at build.
# `image` fields and rich-text uploads browse/store here.
media:
  input: src/assets/media
  output: /media

# Custom buttons in the Pages CMS admin sidebar. "Publish" dispatches the
# cms-publish workflow against the current branch (ref: current), which merges
# that branch's open PR into main and then triggers the production deploy
# (cd-prod). The PR is opened automatically on save (cms-open-pr workflow) and
# cd-preview posts a preview, so this is the only manual step to go live.
actions:
  - name: publish
    label: Publish changes
    workflow: cms-publish.yml
    ref: current
    cancelable: false
    confirm: true

content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    format: yaml
    filename: '{fields.slug}.yaml'
    view:
      fields: [title, slug]
      primary: title
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: URL slug, type: string }
      - { name: metaDescription, label: Meta description, type: text }
      - name: blocks
        label: Blocks
        type: block
        list: true
        blockKey: type
        blocks:
          # ---- hero ----
          - name: hero
            label: Hero
            fields:
              - {
                  name: variant,
                  label: Variant,
                  type: select,
                  options: { values: [fullscreen, standard] },
                }
              - { name: heading, label: Heading, type: string, required: true }
              - { name: subheading, label: Subheading, type: string }
              - { name: body, label: Body, type: text }
              - name: image
                label: Image
                type: object
                fields:
                  - { name: src, label: Image, type: image, required: true }
                  - { name: alt, label: Alt text, type: string }
                  - { name: width, label: Width, type: number }
                  - { name: height, label: Height, type: number }
              - name: ctas
                label: CTAs
                type: object
                list: true
                fields:
                  - { name: label, label: Label, type: string, required: true }
                  - { name: href, label: URL, type: string, required: true }
                  - {
                      name: variant,
                      label: Style,
                      type: select,
                      options:
                        {
                          values:
                            [
                              primary,
                              outline,
                              outline-inverse,
                              solid-inverse,
                              ghost,
                            ],
                        },
                    }
                  - { name: external, label: Opens in new tab, type: boolean }
          # ---- events (list injected at render time from the events collection) ----
          - name: events
            label: Events section
            fields:
              - { name: heading, label: Heading, type: string, required: true }
              - { name: intro, label: Intro, type: text }
              - {
                  name: limit,
                  label: Max events to show (soonest first; blank = all),
                  type: number,
                }
              - name: viewAllCta
                label: '"View all" CTA'
                type: object
                fields:
                  - { name: label, label: Label, type: string, required: true }
                  - { name: href, label: URL, type: string, required: true }
                  - {
                      name: variant,
                      label: Style,
                      type: select,
                      options:
                        {
                          values:
                            [
                              primary,
                              outline,
                              outline-inverse,
                              solid-inverse,
                              ghost,
                            ],
                        },
                    }
                  - { name: external, label: Opens in new tab, type: boolean }
          # ---- sectionHeading ----
          - name: sectionHeading
            label: Section heading
            fields:
              - { name: heading, label: Heading, type: string, required: true }
              - { name: subheading, label: Subheading, type: text }
              - {
                  name: align,
                  label: Align,
                  type: select,
                  options: { values: [left, center] },
                }
              - {
                  name: background,
                  label: Background,
                  type: select,
                  options: { values: [base, raised, inverse, accent] },
                }
              - {
                  name: headingColor,
                  label: Heading color,
                  type: select,
                  options: { values: [accent, dark, inverse, muted] },
                }
              - {
                  name: variant,
                  label: Variant,
                  type: select,
                  options: { values: [heading, lead] },
                }
              - {
                  name: width,
                  label: Width,
                  type: select,
                  options: { values: [narrow, medium, wide] },
                }
          # ---- activityGrid ----
          - name: activityGrid
            label: Activity grid
            fields:
              - { name: heading, label: Heading, type: string }
              - { name: subheading, label: Subheading, type: string }
              - name: image
