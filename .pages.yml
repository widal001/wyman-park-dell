              - {
                  name: paddingBottom,
                  label: Padding bottom,
                  type: select,
                  options: { values: [default, small, none] },
                }
              - name: images
                label: Images
                type: object
                list: true
                fields:
                  - { name: src, label: Image, type: image, required: true }
                  - { name: alt, label: Alt text, type: string }
                  - { name: width, label: Width, type: number }
                  - { name: height, label: Height, type: number }
          # ---- followUs ----
          - name: followUs
            label: Follow us
            fields:
              - { name: heading, label: Heading, type: string }
              - {
                  name: background,
                  label: Background,
                  type: select,
                  options: { values: [base, raised] },
                }
              - {
                  name: paddingTop,
                  label: Padding top,
                  type: select,
                  options: { values: [default, small, large, xl, none] },
                }
              - {
                  name: paddingBottom,
                  label: Padding bottom,
                  type: select,
                  options: { values: [default, small, large, xl, none] },
                }
          # ---- textWithMedia ----
          - name: textWithMedia
