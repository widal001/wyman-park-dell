        external: true
      - label: "Olmsted Brothers’ Vision"
        href: "https://www.olmstedmaryland.org/olmsted-brothers-vision-for-wyman-and-the-stony-run-stream-valley/"
        external: true
  - type: timeline
    eyebrow: Wyman Park
    heading: Master plan
    entries:
      - date: "Early 2000s"
        title: "Developing the master plan"
        body: "The Wyman Park Dell Master Plan Steering Committee engaged local landscape architecture firm Mahan Rykiel Associates to lead the local community in developing a Master Plan for the Dell. The master plan process was grounded in community-based planning with involvement from the surrounding communities and institutions."
      - date: "August 2006"
        title: "Plan approved"
        body: "The plan was presented by the Baltimore City Department of Recreation and Parks to the Baltimore City Commission for Historical and Architectural Preservation (CHAP) and approved with the exception of two items."
      - date: "2010"
        title: "Dry stone wall restored"
        body: "Restoration of the dry stone wall in the Lower Dell, an important Dell icon."
      - date: "2013"
        title: "Park information board installed"
        body: "Welcome signs with message boards at the main entrances to the park are installed to orient visitors and provide space to market community events."
      - date: "2015"
        title: "Playground constructed"
        body: "Baltimore City Department of Recreation and Parks constructs a new playground in the Dell. Ping Pong Baltimore partners with FWPD to install a ping pong table nearby."
      - date: "2016"
        title: "Shade sail installed"
        body: "As an extension of the playground project, a shade sail is installed with support from the Homewood Community Partners Initiative."
      - date: "2017"
        title: "Tree pruning"
        body: "A grant from the Johns Hopkins Neighborhood Fund helps prune trees to improve safety and visibility."
      - date: "2020"
        title: "Slope clearing"
        body: "The FWPD crowdfunds money to hire Eco-Goats to clear the “BMA Slope” of invasive vegetation."
  - type: cta
    background: bar
    heading: "What improvements would you like to see at the park?"
    ctas:
      - label: "Contact us with suggestions and comments"
