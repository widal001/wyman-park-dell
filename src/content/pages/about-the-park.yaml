  - type: twoColumnText
    background: raised
    alignAcross: false
    paddingTop: none
    leftBody: |
      The Wyman Park Dell Master Plan process was underwritten through a generous grant from the [Goldseker Foundation](https://www.goldsekerfoundation.org/) with additional contributions from the [Baltimore Museum of Art](https://artbma.org/), [Johns Hopkins University](https://www.jhu.edu/), the Friends of Wyman Park Dell, Remington community members, the [Charles Village Civic Association](https://charlesvillage.org/), the [Friends of Maryland's Olmsted Parks and Landscapes](https://www.olmstedmaryland.org/), the [Baltimore City Department of Recreation and Parks](https://bcrp.baltimorecity.gov/), and the [Baltimore Community Foundation](https://www.bcf.org/).
    rightBody: |
      The Friends of Wyman Park Dell continue to implement the Master Plan with the support of volunteers and Baltimore's philanthropic community.
    ctas:
      - label: "Learn more about the Friends of Wyman Park Dell"
        href: "/friends-of-wyman-park-dell/"
  - type: textWithMedia
    heading: Harriet Tubman Grove
    mediaPosition: right
    image:
      src: "/media/pictures/WPD_Harriet-Tubman-Grove.jpg"
      alt: "Harriet Tubman Grove at Wyman Park Dell"
    body: |
      The grove on the western plateau of the Dell is now named in honor of Harriet Tubman, an abolitionist and “conductor” on the Underground Railroad. At a community celebration on March 10, 2018, Tubman’s living descendants joined community residents, local activists, and City and State officials to rededicate the area of Wyman Park Dell where a Confederate monument once stood. The monument base remains.

      The Lee and Jackson Monument was removed from the Dell on August 16, 2017, as national debate around Confederate monuments intensified after deadly white supremacist violence in Charlottesville, Virginia. More information is available through the [Baltimore Commission on Historical and Architectural Preservation](https://chap.baltimorecity.gov/confederate-monuments) and the [Special Commission to Review Baltimore’s Confederate Monuments](https://baltimoreplanning.wixsite.com/monumentcommission/leeandjacksonmonument).

      In 2020, placemaking and [interpretive signage](https://www.baltimoresun.com/maryland/baltimore-city/bs-md-ci-harriet-tubman-grove-signs-wyman-park-dell-20200914-frw5es5rhjdidczjnjdlbfhzl4-story.html) was installed in the grove in collaboration with Baltimore City Department of Recreation and Parks and the Commission for Historical and Architectural Preservation. This project was made possible by the Baltimore National Heritage Area.
