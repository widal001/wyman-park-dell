title: Visit us
slug: contact
metaDescription: "Find Wyman Park Dell at North Charles and 29th Streets in Baltimore. Get in touch with the Friends of Wyman Park Dell about volunteering, partnerships, or events."
blocks:
  - type: hero
    variant: standard
    heading: Visit us
    image:
      src: "/media/Contact-Us_WymanPark-Snow-2021.jpg"
      alt: "Wyman Park Dell on a snowy day"
  - type: richText
    align: left
    paddingTop: default
    paddingBottom: large
    width: wide
    background: raised
    body: |
      <h2>Wyman Park Dell<br />North Charles and 29th Streets<br />Baltimore, MD 21218</h2>

      From North Charles Street and 29th Street, an ADA-accessible paved path leads past the playground to the lower Dell.

      The lower Dell can also be accessed by stairs on the southwest and northeast corners of the park, as well as stairs on Art Museum Drive across from the Baltimore Museum of Art.
