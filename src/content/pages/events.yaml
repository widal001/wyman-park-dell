title: Events
slug: events
metaDescription: Join us at Wyman Park Dell. Annual celebrations, neighborhood
  gatherings, and community events year-round.
blocks:
  - type: hero
    variant: standard
    heading: Join us at the Dell
    image:
      src: /media/pictures/Events-banner-scaled.jpg
      alt: A community gathering at Wyman Park Dell
  - type: events
    heading: Our events
    intro: A variety of events take place in Wyman Park Dell throughout the year.
      From park clean-ups to neighborhood festivals, the Dell is the perfect
      place to celebrate community.
    display: carousel
    viewAllCta:
      external: false
  - type: projects
    heading: Annual events
    intro: A handful of beloved gatherings return to the Dell every year — celebrate
      each season and the community alongside us. The FWPD organizes the events
      below.
    projects:
      - title: Annual Meeting
        body: Friends of Wyman Park Dell hosts an Annual Meeting at a different local
          venue each March to celebrate the great things happening in the park.
        image:
          src: /media/dell.jpg
          alt: View of the Dell
        caption: View of the Dell
      - title: Summer Solstice in the Dell
        body: Friends of Wyman Park Dell provides an amazing outdoor summer concert each
          June. Bring your chairs and a picnic for a lovely evening of fun and
          exciting music in one of the most unique and beautiful green spaces in
          Baltimore.
        image:
          src: /media/summer solstice concert.jpg
          alt: Summer Solstice concert in the Dell
        caption: Summer Solstice concert in the Dell
      - title: Goats on the Slope
        body: In the fall, FWPD brings goats to graze the BMA Slope. Goats on the Slope
          has become a much-loved annual event.
        image:
          src: /media/goats.jpg
          alt: Goats on the Slope
        caption: Goats on the Slope
      - title: Spooky Tuesdays in the Dell
        body: Spooky Tuesdays in the Dell brings the big screen to the park each October
          with showings of scary (and family-friendly!) films. This event is led
          by the Friends of Wyman Park Dell with the support of local businesses
          and sponsors.
        image:
          src: /media/pictures/Events_Spooky-Tuesdays-in-the-Dell.jpg
          alt: Outdoor movie night at Wyman Park Dell
        caption: Outdoor movie nights every Tuesday in October.
      - title: Winter Solstice in the Dell
        body: Every December 21, we invite neighbors to gather in the park to celebrate
          the Winter Solstice in the Dell. Enjoy music, marshmallows, and hot
          drinks and cookies provided by local restaurant Gertrude’s.
        image:
          src: /media/pictures/Events_Winter-Solstice.jpg
          alt: Winter Solstice gathering at Wyman Park Dell
        caption: December 21 each year — courtesy of Gertrude’s.
      - title: Other events in partnership with our community
        body: >-
          The Holi Color Celebration invites the community to a "color fight" in
          the lower Dell to mark the arrival of spring. This event is organized
          by local restaurant Sweet 27 in partnership with the Friends of Wyman
          Park Dell.

          Shakespeare Beyond brings arts programming into neighborhoods across
          Baltimore, with a production of Shakespeare in the Dell each July.
        image:
          src: /media/pictures/Events_Holi-Colors-Celebration.jpg
          alt: Holi Color Celebration at Wyman Park Dell
        caption: Held each spring in partnership with Sweet 27.
  - type: twoColumnText
    leftHeading: How to host an event
    leftBody: Special events in Wyman Park Dell are permitted by Baltimore City. We
      recommend reviewing the process early and applying at least **eight
      weeks** prior to your event. We also suggest checking the Friends of Wyman
      Park Dell calendar to avoid conflicts with scheduled events.
    leftCtas:
      - label: Permit information
        href: https://www.baltimorecity.gov/permits-and-licensing/events
        external: true
    rightHeading: Interested in partnering?
    rightBody: The Friends of Wyman Park Dell love collaborating with neighbors,
      local businesses, and community groups. Whether you have an idea for a new
      gathering or want to co-host an existing one, we’d love to hear from you.
    rightCtas:
      - label: Get in touch with the Friends today
        href: /contact
        external: false
    background: raised
    alignAcross: false
  - type: newsletter
    heading: Sign up for our newsletter
    subheading: Never miss an event at the Dell.
    background: base
