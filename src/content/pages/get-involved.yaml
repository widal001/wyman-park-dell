title: Get involved
slug: get-involved
metaDescription: Become a Friend of the Dell. Donate, volunteer, or partner with
  the Friends of Wyman Park Dell to help keep this Baltimore park accessible and
  extraordinary for everyone!
blocks:
  - type: hero
    variant: standard
    heading: Become a Friend of the Dell
    image:
      src: /media/pictures/241433689_10159395889436061_7809489849254585591_n.jpg
      alt: Friends of Wyman Park Dell volunteers gathered for a clean-up
  - type: sectionHeading
    heading: The Dell is almost entirely supported by people like you. As a
      nonprofit, the Friends of Wyman Park Dell need your support to keep this
      public space accessible — and extraordinary — for everyone.
    align: center
    headingColor: dark
    variant: lead
    width: medium
  - type: textWithMedia
    heading: Make a donation
    body: >-
      Donors like you are critical to maintaining, beautifying, and programming
      the Dell. Donate today by making a one-time gift or setting up a recurring
      donation to maximize your impact.


      Prefer to give by mail? Make checks payable to the **Friends of Wyman Park
      Dell** and send them to:


      Friends of Wyman Park Dell  

      1008 West 42nd Street  

      Baltimore, MD 21211
    image:
      src: /media/pictures/Volunteer.jpg
      alt: Volunteers gathered at Wyman Park Dell
    mediaPosition: left
  - type: donorbox
    campaignUrl: https://donorbox.org/embed/website-donations-208?designation=Area%20of%20greatest%20need&default_interval=o&hide_donation_meter=true
    paypalExpress: true
    height: 900
    background: raised
  - type: volunteerForm
    heading: Become a volunteer
    body: >-
      The Dell needs you!


      Keep an eye on the [Events Page](/events/) for upcoming park maintenance
      days or sign up to receive opportunities in your inbox.
    image:
      src: /media/pictures/Get-Involved-2-1.jpg
      alt: Volunteers smiling after a Wyman Park Dell clean-up
    mediaPosition: right
    submitLabel: Sign up
  - type: testimonial
    quote: We’re always looking to collaborate with local businesses and
      organizations. Email us if you’d like to collaborate on making something
      happen at the Dell.
    attribution: Friends of Wyman Park Dell
  - type: gallery
    layout: mosaic
    images:
      - src: /media/pictures/WPD_Volunteer_1.jpg
        alt: Volunteers gathered at Wyman Park Dell
      - src: /media/pictures/WPD_Volunteer_2.jpg
        alt: FWPD volunteers tending to the park
      - src: /media/pictures/WPD_Volunteer_3.jpg
        alt: A volunteer working in the Dell
      - src: /media/pictures/WPD_Volunteer_4.jpg
        alt: Volunteers smiling after a clean-up
