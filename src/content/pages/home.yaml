title: Friends of Wyman Park Dell
slug: ""
metaDescription: "Wyman Park Dell is a 16-acre Olmsted-designed public park in Central Baltimore. A green oasis where all are welcome."
blocks:
  - type: hero
    variant: fullscreen
    heading: Welcome to the Wyman Park Dell
    body: "Surrounded by tree-lined slopes, the Dell is a green oasis in the heart of Central Baltimore where all are welcome. Your support is needed to keep this unique public space accessible — and extraordinary — for everyone."
    image:
      src: "/media/pictures/Home-Page-Image-1024x554.webp"
      alt: "Aerial view of Wyman Park Dell in summer"
      width: 1024
      height: 554
    ctas:
      - label: "Get involved"
        href: "https://wymanparkdell.org/get-involved/"
        variant: "solid-inverse"
        external: true
      - label: "Plan your visit"
        href: "https://wymanparkdell.org/contact/#address"
        variant: "outline-inverse"
        external: true
  - type: events
    heading: "Upcoming events"
    intro: "A variety of events take place in Wyman Park Dell throughout the year. From park clean-ups to neighborhood festivals, the Dell is the perfect place to celebrate community."
    limit: 3
    viewAllCta:
      label: "See all events"
      href: "https://wymanparkdell.org/events/"
      variant: "ghost"
      external: true
  - type: sectionHeading
    heading: "How will you discover the Dell?"
    width: medium
    subheading: "The Wyman Park Dell is a 16-acre public park located south of Johns Hopkins University and the Baltimore Museum of Art."
    align: center
    headingColor: dark
  - type: activityGrid
    image:
      src: "/media/pictures/Dell-Plan.jpg"
      alt: "Master plan illustration of Wyman Park Dell"
      width: 800
      height: 660
    items:
      - label: "Stroll the park’s winding paths or people-watch from park benches."
        icon:
          src: "/media/icons/Web-1280-1-1.png"
          alt: ""
          width: 60
          height: 60
      - label: "Throw a frisbee or kick a soccer ball on the lower lawn."
        icon:
          src: "/media/icons/Web-1280-2.png"
          alt: ""
          width: 60
          height: 60
      - label: "Spend time using the playground, ping-pong table, and Little Library."
        icon:
          src: "/media/icons/Web-1280-3.png"
          alt: ""
          width: 60
          height: 60
      - label: "Explore historic features including the Union Sailors & Soldiers Monument."
        icon:
          src: "/media/icons/Web-1280-6.png"
          alt: ""
          width: 60
          height: 60
      - label: "Walk your dog."
        icon:
          src: "/media/icons/Web-1280-7.png"
          alt: ""
          width: 60
          height: 60
      - label: "Picnic at tables in Harriet Tubman Grove."
        icon:
          src: "/media/icons/Web-1280-4.png"
          alt: ""
          width: 60
          height: 60
      - label: "String up a hammock for an afternoon under the trees."
        icon:
          src: "/media/icons/Web-1280-5.png"
          alt: ""
          width: 60
          height: 60
  - type: testimonial
    quote: "Wyman Park Dell is a beautiful, charming oasis in Charles Village. Great place to unwind, walk your dog, read a book, or just quietly reflect."
    attribution: "Park Visitor"
  - type: gallery
    layout: mosaic
    paddingTop: none
    paddingBottom: none
    images:
      - src: "/media/pictures/Home-Page_WPD.jpg"
        alt: "A sunny day at Wyman Park Dell"
        width: 792
        height: 792
      - src: "/media/pictures/Wyman-Park-Dell-2.jpg"
        alt: "Visitors enjoying the lower lawn"
        width: 700
        height: 467
      - src: "/media/pictures/Wyman-Park-Dell-3.jpg"
        alt: "Tree-lined slopes of the Dell in fall"
        width: 800
        height: 533
      - src: "/media/pictures/Wyman-Park-Dell-4.jpg"
        alt: "A community gathering at Wyman Park Dell"
        width: 800
        height: 533
  - type: followUs
    paddingTop: xl
    paddingBottom: xl
