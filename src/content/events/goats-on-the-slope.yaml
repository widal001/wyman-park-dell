title: Goats on the Slope
slug: goats-on-the-slope
date: 2026-09-18
endDate: 2026-09-20
location: BMA Slope, Wyman Park Dell
description: The Eco-Goats return to graze the slopes! Join us for three days of
  family activities alongside the herd that keeps the Dell's invasive plants in
  check.
details: >-
  Each fall, a herd of Eco-Goats spends a few days in Wyman Park Dell doing what

  they do best — clearing the invasive plants along the steep BMA slope that are

  too tough for volunteers to tackle by hand. It's chemical-free land
  management,

  and it's a delight to watch.


  We provide a full weekend of free, family-friendly programming around the
  goat's visit. Check out the events below and come by and see the herd at work.
image:
  src: /media/pictures/Projects_Goats-on-the-Slope-Photo.jpg
  alt: Goats grazing the slope at Wyman Park Dell
schedule:
  - date: 2026-09-18
    time: 1pm-2pm
    title: Kids Storytime with the herd
    description: "Day one kicks off with a family storytime for kids on the BMA
      slope, alongside the goats as they get to work. "
  - date: 2026-09-18
    time: 5pm-7pm
    title: Bluegrass on the Dell
    description: Cap off the first day with a live bluegrass jam in the Dell. Bring
      the family and enjoy music alongside our four-legged landscapers.
  - date: 2026-09-19
    time: 2pm-6pm
    title: Art in the Park in partnership with the Baltimore Museum of Art
    description: Stop by to watch the Eco-Goats clear the slope and enjoy
      kid-friendly art activities provided by the BMA, music, and refreshments
      for sale by the FWPD.
  - date: 2026-09-20
    time: 11am-12pm
    title: Yoga in the Park
    description: The goats' visit wraps up with an all-levels yoga session. Roll out
      a mat on the lawn and stretch in the company of the herd.
