schedule:
  - date: 2026-09-18
    time: 1 PM - 2 PM
    title: Kids Storytime
    description: Day one kicks off with a family storytime for kids on the BMA
      slope, alongside the goats as they get to work.
    cta:
      external: false
  - date: 2026-09-18
    time: 5 PM - 7 PM
    title: Bluegrass in the Dell
    description: "Cap off the goat's first day with a live bluegrass jam in the
      Dell. Bring the family, a picnic, and enjoy live music alongside our
      four-legged landscapers. FWPD will be there selling snacks, drinks, and
      merch. "
    cta:
      external: false
  - date: 2026-09-19
    time: 10 AM - 12PM
    title: Family Art Adventure, in partnership with the Baltimore Museum of Art
    description: "Join us for a special iteration of the BMA's Family Art Adventure
      program at Goats on the Slope! Family Art Adventure is a free, two hour
      drop-in program once a month on Saturdays. Families are invited to come
      and go at their leisure, enjoying activities in one specific gallery each
      month. Typically, activities center around a specific artwork and theme
      each month and involve a combination of sensory play, imaginative play,
      artmaking, and wayfinding through the galleries. "
    cta:
      label: Explore the BMA
      href: https://artbma.org/
      variant: outline
      external: true
  - date: 2026-09-20
    time: 11 AM - 12 PM
    title: Yoga in the Park
    description: The goats' visit wraps up with an all-levels and family friendly
      yoga session. Roll out a mat on the lawn and stretch while gazing at the
      herd. Maria Simon of Yoga Union will lead a free outdoor class open to
      everyone. Participants should bring their own yoga or exercise mat, bottle
      of water, and any blocks, blankets, straps, or other props they wish to
      use. Loose fitting or sweat-wicking clothing that allows you to move your
      body parts is recommended, as is bare feet. FWPD will provide a water
      cooler for refilling your bottle. We hope you can join us for yoga in the
      park at Goats on the Slope!
    image:
      src: /media/yoga in the dell.jpg
      alt: Yoga on the lawn at Wyman Park Dell
    cta:
      label: Yoga Union
      href: https://www.yogaunionbaltimore.com/
      variant: outline
      external: true
