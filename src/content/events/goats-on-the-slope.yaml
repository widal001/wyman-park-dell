title: Goats on the Slope
slug: goats-on-the-slope
date: 2026-09-18
endDate: 2026-09-21
location: BMA Slope, Wyman Park Dell
description: The goats return to graze the slopes! Join us for a full weekend of
  activities alongside the herd that keeps the Dell's invasive plants in check.
details: |-
  Each fall, a herd of goats spends a few days in Wyman Park Dell doing what  they do best — clearing the invasive plants along the steep BMA slope that are  too tough for volunteers to tackle by hand. It's chemical-free land management, and it's a delight to watch.

  We provide a full weekend of free, family-friendly programming around the goat's visit. Check out the events below and come by and see the herd at work.

  Check out our press from previous years:

  [Baltimore Magazine](https://www.baltimoremagazine.com/section/community/goats-returning-to-bma-slope-wyman-park-dell-to-clear-excess-vegetation/)

  [Baltimore Fishbowl](https://baltimorefishbowl.com/stories/goats-on-the-slope-weekend-is-coming-baaaa-ck-to-wyman-park-dell/)

  [WBAL](https://www.youtube.com/watch?v=4KnY-TUHdWo)

  Please respect our project and stay behind the orange safety fencing while viewing the goats. The BMA slope is steep, full of poison ivy, and the white fence is electric. We don’t want people or goats getting hurt. Do not try to feed or touch the goats.
