title: Goats on the Slope
slug: goats-on-the-slope
date: "2026-09-18"
endDate: "2026-09-20"
location: "BMA Slope, Wyman Park Dell"
description: "The Eco-Goats return to graze the slopes! Join us for three days of family activities alongside the herd that keeps the Dell's invasive plants in check."
details: |
  Each fall, a herd of Eco-Goats spends a few days in Wyman Park Dell doing what
  they do best — clearing the invasive plants along the steep BMA slope that are
  too tough for volunteers to tackle by hand. It's chemical-free land management,
  and it's a delight to watch.

  We build a weekend of free, family-friendly programming around their visit.
  Come by any time to see the herd at work, and check the schedule below for the
  storytimes, music, and yoga happening alongside them.
