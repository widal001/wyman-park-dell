description: Join the Friends of Wyman Park Dell on the second Sunday of every
  month to help care for the park.
details: >-
  Come out to the park and join the Friends of Wyman Park Dell on the second
  Sunday of every month from 10 AM to 12 PM. We need your help to keep the park
  beautiful! Activities include littler cleanup, graffiti removal, pruning,
  watering young trees, planting native species, and more!  
    
  We meet at the shed in the Lower Dell. Hope to see ya there! 
