title: Bulbs on the Slope
slug: bulbs-on-the-slope
date: 2026-11-07
time: 10AM - 1PM
location: Wyman Park Dell
description: "After the hard work of the goats clearing the BMA slope in
  September, we will be planting bulbs and spreading seeds on the recently
  cleared slope in anticipation of next spring! "
details: Please join us to plant bulbs, seed balls, and spread native seeds on
  the BMA slope. All are welcome, and all supplies will be provided by the FWPD.
  We will meet in the lower Dell at bottom of the BMA slope.
