title: Shakespeare in the Dell with the Bookmobile
slug: shakespeare-in-the-dell
date: 2026-07-30
time: 6pm-9pm
location: Wyman Park Dell
description: An evening of live outdoor theater on the lower lawn. Bring a
  blanket or a low chair and enjoy Shakespeare under the summer sky in the Dell.
  The Bookmobile will be there too, giving out free books!
details: The Baltimore Ravens Bookmobile of [The Maryland Book
  Bank](https://www.mdbookbank.org/?gad_source=1&gad_campaignid=70433850&gbraid=0AAAAADu8cjaHs511Bgz2350eB2Dg-jzKI&gclid=CjwKCAjwsfzSBhB5EiwAOGyqSVETpqEEktiweoeTuOFL7bbXXa_nLuBw6tH-EB19DnwJsVm0CDNHbRoC3GwQAvD_BwE)
  will be joining
  [@shakespearebeyond](https://www.instagram.com/shakespearebeyond/) in the Dell
  on Thursday, July 30! The Bookmobile is a free, mobile book bank sponsored by
  the Baltimore Ravens that provides great quality children’s books. Kids that
  come out can receive up to 3 free books! See you there from 6pm to 7:30pm
  ahead of the performance of Romeo and Juliet!
