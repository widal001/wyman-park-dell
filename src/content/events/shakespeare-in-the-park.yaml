title: Shakespeare in the Dell with the Bookmobile
slug: shakespeare-in-the-dell-with-the-bookmobile
date: 2026-07-30
time: 6 PM - 9 PM
location: Wyman Park Dell
description: An evening of live outdoor theater on the lower lawn provided by
  Shakespeare Beyond of the Chesapeake Shakespeare Company. Bring a blanket or a
  low chair and enjoy Shakespeare under the summer sky in the Dell. The
  Baltimore Ravens Bookmobile will be there too!
details: |-
  ![](</media/romeo and juliet.jpg>)

  Swing by the Dell with your friends on Thursday, July 30, for a free performance of Romeo and Juliet, presented by [Shakespeare Beyond](https://www.chesapeakeshakespeare.com/beyond/) of Chesapeake Shakespeare Company.

  FWPD will be there selling refreshments and merch. 

  ![](/media/bookmobile.jpg)

  The Baltimore Ravens Bookmobile of [The Maryland Book Bank](https://www.mdbookbank.org/?gad_source=1&gad_campaignid=70433850&gbraid=0AAAAADu8cjaHs511Bgz2350eB2Dg-jzKI&gclid=CjwKCAjwsfzSBhB5EiwAOGyqSVETpqEEktiweoeTuOFL7bbXXa_nLuBw6tH-EB19DnwJsVm0CDNHbRoC3GwQAvD_BwE) will be joining Shakespeare Beyond in the Dell before the performance. The Bookmobile is a free, mobile book bank sponsored by the Baltimore Ravens that provides great quality children’s books. Kids that come out can receive up to three free books!

  Thursday, July 30, 2026  

  The Shakespeare Beyond Residency begins at 6pm.

  Baltimore Ravens Bookmobile will be open from 6pm to 7:30pm.

  Performance of Romeo and Juliet begins at 7:30pm.

  Rain date is Friday, August 7.
