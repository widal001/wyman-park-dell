title: Fall Movies Series
slug: fall-movie-series
date: 2026-09-04
endDate: 2026-11-13
time: 7PM - 11PM
location: Wyman Park Dell
description: "CVCBD Presents: Screen on the Green, Nights of Fright & Fun at
  Wyman Park Dell! Get ready for an entire season of movies, music, community,
  and fun under the stars! CVCBD, in partnership with FWPD, will bring free
  outdoor movie experiences to the Dell. "
details: "Join us this fall for six nights of spooky favorites, nostalgic
  classics, and seasonal fun. Bring your blanket, lawn chairs, friends, family,
  and neighbors — we’ll bring the movies!  Arrive at 7pm to claim your seat and
  purchase some snacks. The movie showing starts at sunset. Visit
  [CVCBD](https://www.instagram.com/cvcbd_baltimore/p/DcMGrDlEfNC/) for more
  information! The FWPD will be there selling snacks and merch on September 18
  and October 30. "
